<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏幕截图文本识别工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v2.1.1/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            overflow: hidden;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        button.processing {
            background-color: #f39c12;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .icon {
            font-size: 20px;
        }
        
        .content-area {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .image-area, .text-area {
            flex: 1;
            position: relative;
            border: 2px dashed #ddd;
            border-radius: 8px;
            height: 400px;
            padding: 15px;
            overflow: auto;
        }
        
        .image-area {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
        }
        
        #screenshotImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .text-area {
            background-color: #fff;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
            font-family: monospace;
            white-space: pre-wrap;
        }
        
        .placeholder {
            color: #95a5a6;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            padding: 0 20px;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-size: 18px;
        }
        
        .progress-bar {
            width: 80%;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s;
        }
        
        .language-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 16px;
            background-color: white;
        }
        
        .copy-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            background-color: rgba(52, 152, 219, 0.1);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
        }
        
        .copy-btn:hover {
            background-color: rgba(52, 152, 219, 0.2);
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .notification.show {
            opacity: 1;
        }
        
        .drag-area {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #3498db;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .drag-area.active {
            border-color: #2ecc71;
            background-color: rgba(46, 204, 113, 0.05);
        }
        
        .how-to-use {
            margin-top: 30px;
            padding: 20px;
            background-color: #f1f9ff;
            border-radius: 8px;
        }
        
        .how-to-use h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .how-to-use ol {
            padding-left: 20px;
        }
        
        .how-to-use li {
            margin-bottom: 8px;
        }
        
        @media (max-width: 768px) {
            .content-area {
                flex-direction: column;
            }
            
            .image-area, .text-area {
                height: 300px;
            }
            
            .control-panel {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>屏幕截图文本识别工具</h1>
        
        <div class="language-selector">
            <select id="languageSelect">
                <option value="chi_sim">中文简体</option>
                <option value="chi_tra">中文繁体</option>
                <option value="eng">英语</option>
                <option value="jpn">日语</option>
                <option value="kor">韩语</option>
            </select>
        </div>
        
        <div class="control-panel">
            <button id="captureBtn"><span class="icon">📷</span>捕获屏幕</button>
            <button id="uploadBtn"><span class="icon">📤</span>上传图片</button>
            <button id="recognizeBtn" disabled><span class="icon">🔍</span>识别文字</button>
            <input type="file" id="fileInput" style="display: none" accept="image/*">
        </div>
        
        <div class="content-area">
            <div class="image-area" id="imageArea">
                <div class="placeholder" id="imagePlaceholder">
                    <p>在这里显示截图或上传的图片</p>
                    <p>支持拖放图片到此区域</p>
                </div>
                <img id="screenshotImage" style="display: none">
                <div class="drag-area" id="dragArea">
                    <div class="icon" style="font-size: 40px; margin-bottom: 15px;">📁</div>
                    <p>拖放图片到这里或点击上传</p>
                </div>
            </div>
            
            <div class="text-area" id="textArea">
                <button class="copy-btn" id="copyBtn">复制</button>
                <div class="placeholder" id="textPlaceholder">识别结果将在这里显示</div>
                <div id="recognizedText"></div>
                <div class="loading" id="loadingIndicator" style="display: none">
                    <p id="statusText">正在识别文字...</p>
                    <div class="progress-bar">
                        <div class="progress" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="how-to-use">
            <h3>使用说明</h3>
            <ol>
                <li><strong>捕获屏幕：</strong> 点击"捕获屏幕"按钮，然后选择要分享的屏幕或窗口。</li>
                <li><strong>上传图片：</strong> 点击"上传图片"按钮或拖放图片到左侧区域。</li>
                <li><strong>识别文字：</strong> 显示图片后，点击"识别文字"按钮开始OCR识别。</li>
                <li><strong>切换语言：</strong> 根据图片中的文字语言选择适当的识别语言。</li>
                <li><strong>复制结果：</strong> 点击右侧区域的"复制"按钮可复制识别结果。</li>
            </ol>
        </div>
        
        <div class="notification" id="notification">文本已复制到剪贴板！</div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 元素获取
            const captureBtn = document.getElementById('captureBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const recognizeBtn = document.getElementById('recognizeBtn');
            const fileInput = document.getElementById('fileInput');
            const screenshotImage = document.getElementById('screenshotImage');
            const recognizedText = document.getElementById('recognizedText');
            const imagePlaceholder = document.getElementById('imagePlaceholder');
            const textPlaceholder = document.getElementById('textPlaceholder');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const languageSelect = document.getElementById('languageSelect');
            const copyBtn = document.getElementById('copyBtn');
            const notification = document.getElementById('notification');
            const dragArea = document.getElementById('dragArea');
            const imageArea = document.getElementById('imageArea');
            
            // 维护当前图像的blob URL
            let currentImageUrl = null;
            
            // 初始化Tesseract
            const worker = Tesseract.createWorker({
                logger: progress => {
                    if (progress.status === 'recognizing text') {
                        const p = Math.round(progress.progress * 100);
                        progressBar.style.width = `${p}%`;
                        statusText.textContent = `正在识别文字... ${p}%`;
                    } else {
                        statusText.textContent = progress.status;
                    }
                }
            });
            
            // 初始化worker
            (async () => {
                await worker.load();
                await worker.loadLanguage('chi_sim');
                await worker.initialize('chi_sim');
            })();
            
            // 语言改变时重新加载
            languageSelect.addEventListener('change', async () => {
                const selectedLanguage = languageSelect.value;
                await worker.loadLanguage(selectedLanguage);
                await worker.initialize(selectedLanguage);
            });
            
            // 屏幕捕获
            captureBtn.addEventListener('click', async () => {
                try {
                    // 请求获取屏幕
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: "screen" }
                    });
                    
                    // 创建视频元素以捕获帧
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    
                    // 当视频加载元数据后捕获帧
                    video.onloadedmetadata = () => {
                        video.play();
                        
                        // 创建Canvas来绘制视频帧
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        // 停止所有轨道以释放资源
                        stream.getTracks().forEach(track => track.stop());
                        
                        // 将Canvas转换为blob URL
                        canvas.toBlob(blob => {
                            if (currentImageUrl) {
                                URL.revokeObjectURL(currentImageUrl);
                            }
                            
                            currentImageUrl = URL.createObjectURL(blob);
                            screenshotImage.src = currentImageUrl;
                            screenshotImage.style.display = 'block';
                            imagePlaceholder.style.display = 'none';
                            dragArea.style.display = 'none';
                            
                            recognizeBtn.disabled = false;
                        });
                    };
                } catch (err) {
                    console.error("Error capturing screen:", err);
                    alert("无法捕获屏幕：" + err.message);
                }
            });
            
            // 上传图片
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', handleFileSelection);
            
            // 处理文件选择
            function handleFileSelection() {
                const file = fileInput.files[0];
                if (file && file.type.startsWith('image/')) {
                    processSelectedFile(file);
                }
                fileInput.value = null; // 重置文件输入以允许重新选择相同文件
            }
            
            // 处理选定的文件
            function processSelectedFile(file) {
                if (currentImageUrl) {
                    URL.revokeObjectURL(currentImageUrl);
                }
                
                currentImageUrl = URL.createObjectURL(file);
                screenshotImage.src = currentImageUrl;
                screenshotImage.style.display = 'block';
                imagePlaceholder.style.display = 'none';
                dragArea.style.display = 'none';
                
                recognizeBtn.disabled = false;
            }
            
            // 拖放功能
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                imageArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                imageArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                imageArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dragArea.classList.add('active');
            }
            
            function unhighlight() {
                dragArea.classList.remove('active');
            }
            
            imageArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                
                if (files.length && files[0].type.startsWith('image/')) {
                    processSelectedFile(files[0]);
                }
            }
            
            // 点击拖放区域触发文件上传
            dragArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 识别文字
            recognizeBtn.addEventListener('click', async () => {
                if (!currentImageUrl) {
                    return;
                }
                
                recognizeBtn.disabled = true;
                recognizeBtn.classList.add('processing');
                loadingIndicator.style.display = 'flex';
                progressBar.style.width = '0%';
                recognizedText.textContent = '';
                textPlaceholder.style.display = 'none';
                
                try {
                    const result = await worker.recognize(screenshotImage);
                    recognizedText.textContent = result.data.text;
                } catch (err) {
                    console.error("Error recognizing text:", err);
                    recognizedText.textContent = "识别失败: " + err.message;
                } finally {
                    loadingIndicator.style.display = 'none';
                    recognizeBtn.disabled = false;
                    recognizeBtn.classList.remove('processing');
                }
            });
            
            // 复制文本功能
            copyBtn.addEventListener('click', () => {
                if (recognizedText.textContent) {
                    navigator.clipboard.writeText(recognizedText.textContent)
                        .then(() => {
                            notification.classList.add('show');
                            setTimeout(() => {
                                notification.classList.remove('show');
                            }, 2000);
                        })
                        .catch(err => {
                            console.error('无法复制文本: ', err);
                        });
                }
            });
            
            // 清理函数
            window.addEventListener('beforeunload', () => {
                if (currentImageUrl) {
                    URL.revokeObjectURL(currentImageUrl);
                }
                worker.terminate();
            });
        });
    </script>
</body>
</html>
