<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连连看小游戏</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>连连看</h1>
            <div class="game-info">
                <div class="time"><span class="icon">⏱️</span> 时间: <span id="time">60000</span>秒</div>
                <div class="score"><span class="icon">🏆</span> 分数: <span id="score">0</span></div>
            </div>
        </div>
        
        <div class="props-container">
            <div class="prop" id="hintProp">
                <div class="prop-icon">💡</div>
                <div class="prop-count"><span id="hintCount">3000</span></div>
                <div class="prop-name">提示</div>
            </div>
            <div class="prop" id="timeProp">
                <div class="prop-icon">⏰</div>
                <div class="prop-count"><span id="timeCount">20000</span></div>
                <div class="prop-name">+10秒</div>
            </div>
            <div class="prop" id="shuffleProp">
                <div class="prop-icon">🔄</div>
                <div class="prop-count"><span id="shuffleCount">10000</span></div>
                <div class="prop-name">重排</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="game-controls">
            <button id="startButton" class="cute-button">开始游戏</button>
            <button id="restartButton" class="cute-button">重新开始</button>
        </div>
        
        <div id="gameMessage" class="game-message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
